    path: "modules/mod-account-achievements"
  - name: "mod-low-level-rbg"
    path: "modules/mod-low-level-rbg"
  - name: "mod-fly-in-old-world"
    path: "modules/mod-fly-in-old-world"
  - name: "mod-desertion-warnings"
    path: "modules/mod-desertion-warnings"
  - name: "mod-duel-reset"
    path: "modules/mod-duel-reset"
  - name: "mod-breaking-news-override"
    path: "modules/mod-breaking-news-override"
  - name: "mod-challenge-modes"
    path: "modules/mod-challenge-modes"
params:
  CONTEXT: .
  DOCKERFILE: apps/docker/Dockerfile
  TARGET: ((target))
run:
  path: sh
  args:
    - -cex
    - |
      rm modules/mod-dead-means-dead/data/sql/db-world/base/skeleton_module_acore_string.sql
      rm modules/mod-fly-in-old-world/data/sql/db-world/base/skeleton_module_acore_string.sql
      build
outputs:
  - name: image
---
