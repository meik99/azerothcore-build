resources:
  - name: authserver
    type: registry-image
    icon: docker
    source:
      repository: harbor.rynkix.com/azerothcore/authserver
      username: ((registry.username))
      password: ((registry.password))
      tag: latest
  - name: worldserver
    type: registry-image
    icon: docker
    source:
      repository: harbor.rynkix.com/azerothcore/worldserver
      username: ((registry.username))
      password: ((registry.password))
      tag: latest
  - name: db-import
    type: registry-image
    icon: docker
