jobs:
  - name: build
    build_log_retention:
      builds: 3
    plan:
      - in_parallel:
          - get: azerothcore
            trigger: true
            params:
              depth: 1
          - get: ci
          - get: "mod-playerbots"
            trigger: true
          - get: "mod-autobalance"
            trigger: true
          - get: "mod-solo-lfg"
            trigger: true
          - get: "mod-transmog"
            trigger: true
          - get: "mod-quest-loot-party"
            trigger: true
          - get: "mod-rdf-expansion"
            trigger: true
          - get: "mod-tcg-vendors"
            trigger: true
          - get: "mod-junk-to-gold"
            trigger: true
          - get: "mod_weather_vibe"
            trigger: true
          - get: "mod-pvp-titles"
            trigger: true
          - get: "mod-player-bot-guildhouse"
            trigger: true
          - get: "mod-player-bot-level-brackets"
            trigger: true
          - get: "mod-playerbots-characters"
            trigger: true
          - get: "mod-guild-levels"
            trigger: true
          - get: "mod-dead-means-dead"
            trigger: true
          - get: "mod-war-effort"
            trigger: true
          - get: "mod-aoe-loot"
            trigger: true
          - get: "mod-ah-bot-plus"
            trigger: true
          - get: "mod-account-achievements"
            trigger: true
          - get: "mod-low-level-rbg"
            trigger: true
          - get: "mod-fly-in-old-world"
            trigger: true
          - get: "mod-desertion-warnings"
            trigger: true
          - get: "mod-duel-reset"
            trigger: true
          - get: "mod-cfbg"
            trigger: true
          - get: "mod-breaking-news-override"
            trigger: true
          - get: "mod-challenge-modes"
            trigger: true
      - do:
          - task: authserver
            privileged: true
            file: ci/output/azerothcore/templates/build-stage.yaml
            vars:
              target: authserver
            output_mapping:
              image: authserver
          - put: authserver
            params:
              image: authserver/image.tar

      - do:
          - task: worldserver
            privileged: true
            file: ci/output/azerothcore/templates/build-stage.yaml
            vars:
              target: worldserver
            output_mapping:
              image: worldserver
          - put: worldserver
            params:
              image: worldserver/image.tar
      - do:
          - task: build-db-import
            privileged: true
            file: ci/output/azerothcore/templates/build-stage.yaml
            vars:
              target: db-import
            output_mapping:
              image: db-import
          - put: db-import
            params:
              image: db-import/image.tar
      - do:
          - task: client-data
            privileged: true
            file: ci/output/azerothcore/templates/build-stage.yaml
            vars:
              target: client-data
            output_mapping:
              image: client-data
          - put: client-data
            params:
              image: client-data/image.tar

      - do:
          - task: build-tools
            privileged: true
            file: ci/output/azerothcore/templates/build-stage.yaml
            vars:
              target: tools
            output_mapping:
              image: tools
          - put: tools
            params:
              image: tools/image.tar
