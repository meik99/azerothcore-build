platform: linux
image_resource:
  type: registry-image
  source:
    repository: concourse/oci-build-task
inputs:
  - name: azerothcore
    path: .
{{- range .Values.modules }}
  - name: {{ include "repo.nameFromUri" . | quote }}
    path: {{ printf "%s%s" "modules/" (include "repo.nameFromUri" .) | quote }}
{{- end }}
params:
  CONTEXT: .
  DOCKERFILE: apps/docker/Dockerfile
  TARGET: ((target))
run:
  path: sh
  args:
    - -cex
    - |
      pwd
      ls -lah
      rm modules/mod-dead-means-dead/data/sql/db-world/base/skeleton_module_acore_string.sql
      rm modules/mod-fly-in-old-world/data/sql/db-world/base/skeleton_module_acore_string.sql
      build
outputs:
  - name: image
